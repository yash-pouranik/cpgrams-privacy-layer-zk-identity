name: Tests

# Run the full automated API test suites for both backend services.
# - apps/cpgrams-backend/tests  → needs MongoDB + seeded master data
# - apps/sso-server/tests       → self-contained (no DB required; Prisma client must be generated)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpgrams-backend-tests:
    name: CPGRAMS Backend API Tests (MongoDB)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/cpgrams_db
      # push.test.js authenticates external push requests with this key
      API_PUSH_KEYS: dev-push-key-12345
      NODE_ENV: test
      # verifies the test-only citizen bypass used by voting.test.js
      TEST_AUTH_SECRET: ci-test-auth-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund

      - name: Seed master data (departments, categories, officers)
        run: npm run seed -w apps/cpgrams-backend

      - name: Run CPGRAMS Backend test suite
        run: npm test -w apps/cpgrams-backend

  sso-server-tests:
    name: CivID SSO Server Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      SSO_PAIRWISE_SECRET: ci-pairwise-secret-test
      COURT_ORDER_SECRET: ci-court-order-secret-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (workspaces)
        run: npm install --no-audit --no-fund

      # @prisma/client requires a generated client before PrismaClient can be
      # instantiated by src/models/prismaClient.js at import time.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/sso-server

      - name: Run CivID SSO test suite
        run: npm test -w apps/sso-server
